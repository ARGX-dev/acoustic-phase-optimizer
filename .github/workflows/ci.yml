name: CI

on:
  push:
    branches: [main, rewrite]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.4"
      - run: ruff check acoustic_phase_optimizer tests tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check the web modules
        run: for f in acoustic_phase_optimizer/web/js/*.js; do cp "$f" "$RUNNER_TEMP/check.mjs" && node --check "$RUNNER_TEMP/check.mjs" || exit 1; done

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mesh repair and .trky tests
        run: node --test tests/js

  browser:
    # the Playwright tests are skipped in the plain test job (no browser there); this job runs them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" playwright
          python -m playwright install --with-deps chromium
      - run: pytest -q -rs tests/test_ui.py
        env:
          APO_UI_REQUIRED: "1"
          APO_UI_SHOTS: tests/screenshots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
