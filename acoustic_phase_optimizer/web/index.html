<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acoustic Phase Optimizer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a19'/%3E%3Cpath d='M5 16c3-9 6-9 9 0s6 9 9 0' fill='none' stroke='%233987e5' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M9 16c3 9 6 9 9 0s6-9 9 0' fill='none' stroke='%23d95926' stroke-width='2.6' stroke-linecap='round' opacity='.9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { const t = localStorage.getItem('apo-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar" id="topbar"></header>
    <aside class="left" id="left" aria-label="Venue editor"></aside>
    <main class="centre">
      <section class="card stage-card" aria-label="Coverage map">
        <div class="toolbar" id="stage-toolbar"></div>
        <div class="stage-wrap" id="stage"></div>
        <div class="stage-foot" id="stage-foot"></div>
      </section>
      <section class="card chart-card" aria-label="Frequency response">
        <div class="toolbar" id="chart-toolbar"></div>
        <div class="chart-legend" id="chart-legend"></div>
        <div class="chart-wrap" id="chart"></div>
      </section>
    </main>
    <aside class="right" id="right" aria-label="Results and optimization"></aside>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="boot" class="boot"><div class="boot-box"><div class="spinner"></div><span>Starting the acoustic engine…</span></div></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
