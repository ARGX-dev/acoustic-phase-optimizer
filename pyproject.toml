[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-phase-optimizer"
version = "0.1.0"
description = "Professional live sound DSP optimization platform for reflective venues"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Acoustic Phase Optimizer Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Audio Engineers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "numba>=0.57",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
    "pyopengl>=3.1",
]
full = [
    "acoustic-phase-optimizer[gui]",
    "librosa>=0.10",
    "scikit-learn>=1.3",
]

[project.urls]
"Source" = "https://github.com/anomalyco/acoustic-phase-optimizer"
"Documentation" = "https://github.com/anomalyco/acoustic-phase-optimizer/docs"

[tool.setuptools.packages.find]
include = ["acoustic_phase_optimizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
