[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-phase-optimizer"
dynamic = ["version"]
description = "Predict, align and optimize live sound systems in reflective venues, in your browser"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Acoustic Phase Optimizer Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
acoustic-phase-optimizer = "acoustic_phase_optimizer.__main__:main"

[project.urls]
"Source" = "https://github.com/ARGX-dev/acoustic-phase-optimizer"
"Documentation" = "https://github.com/ARGX-dev/acoustic-phase-optimizer/docs"

[tool.setuptools.dynamic]
version = {attr = "acoustic_phase_optimizer.__version__"}

[tool.setuptools.packages.find]
include = ["acoustic_phase_optimizer*"]

[tool.setuptools.package-data]
acoustic_phase_optimizer = ["engine/data/*.json", "web/*.html", "web/*.css", "web/js/*.js", "web/vendor/three/LICENSE",
                            "web/vendor/three/build/*.js", "web/vendor/three/examples/jsm/*/*.js"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
